<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Voxel Engine</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Top Tabs -->
  <div id="tabs">
    <div class="tab active" data-tab="singleplayer">Singleplayer</div>
    <div class="tab" data-tab="multiplayer">Multiplayer</div>
    <div class="tab" data-tab="yourservers">Your Servers</div>
  </div>

  <div id="uiContainer">
    <!-- SINGLEPLAYER -->
    <div class="tabPanel active" id="singleplayerPanel">
      <div class="mainPanel">
        <h2>Singleplayer</h2>
        <p>Create or load your world to play solo.</p>
      </div>
    </div>

    <!-- MULTIPLAYER -->
    <div class="tabPanel" id="multiplayerPanel">
      <div id="sidebar">
        <input type="text" id="serverSearch" placeholder="Search servers...">
        <ul id="serverList"></ul>
      </div>
      <div class="mainPanel">
        <div id="serverHeader">
          <h2 id="serverName">Select a server</h2>
          <img id="serverIcon" src="" alt="Server Icon">
        </div>
        <p id="serverType"></p>
        <p class="inviteDisplay" id="inviteDisplay"></p>

        <label for="inviteInput">Invite Code:</label>
        <input type="text" id="inviteInput" maxlength="8" placeholder="Enter invite code">
        <p id="inviteError"></p>

        <label for="username">Username:</label>
        <input type="text" id="username" placeholder="Enter username">

        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter password">

        <button id="playButton">Play</button>
      </div>
    </div>

    <!-- YOUR SERVERS -->
    <div class="tabPanel" id="yourserversPanel">
      <div class="mainPanel">
        <h2>Your Servers</h2>
        <p>Servers you’ve joined or own will appear here.</p>
      </div>
    </div>
  </div>

  <canvas id="renderCanvas"></canvas>
  <script src="app.js"></script>
</body>
</html>
