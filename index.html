<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Voxel Engine</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top Tabs -->
  <div id="tabs">
    <div class="tab" data-tab="singleplayer">Singleplayer</div>
    <div class="tab active" data-tab="multiplayer">Multiplayer</div>
    <div class="tab" data-tab="settings">Settings</div>
  </div>

  <!-- Search Bar -->
  <div id="searchBarContainer">
    <input 
      type="text" 
      id="serverSearch" 
      placeholder="Search servers..."
    />
  </div>

  <!-- UI Container -->
  <div id="uiContainer">
    <!-- Sidebar -->
    <div id="sidebar">
      <ul id="serverList">
        <!-- Servers populated by JS -->
      </ul>
    </div>

    <!-- Main Panel -->
    <div id="mainPanel">
      <h2 id="serverName">
        Select a server
        <img id="serverIcon" src="assets/survival.png" alt="Server Icon" style="display:none; width:24px; height:24px; margin-left:8px; vertical-align:middle;">
      </h2>
      <p id="serverType"></p>

      <label for="username">Username:</label>
      <input type="text" id="username">

      <label for="password">Password:</label>
      <input type="password" id="password">

      <label for="inviteInput">Invite Code:</label>
      <input type="text" id="inviteInput" maxlength="8">
      <p id="inviteError" style="color:red; font-size:13px; display:none; margin-top:4px;"></p>

      <button id="playButton">Play</button>
    </div>
  </div>

  <!-- Babylon.js Canvas -->
  <canvas id="renderCanvas"></canvas>

  <!-- Scripts -->
  <script src="app.js"></script>
  <script type="module" src="../src/main.js"></script>
</body>
</html>
