<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Voxel Engine</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top Tabs -->
  <div id="tabs">
    <div class="tab active" data-tab="singleplayer">Singleplayer</div>
    <div class="tab" data-tab="multiplayer">Multiplayer</div>
    <div class="tab" data-tab="yourServers">Your Servers</div>
  </div>

  <!-- Singleplayer Panel -->
  <div class="tabPanel active" id="singleplayerPanel">
    <div id="singleplayerContainer">
      <!-- World List -->
      <div id="worldListBoard">
        <ul id="worldList">
          <!-- Worlds populated by JS -->
        </ul>
      </div>

      <!-- World Info & Power -->
      <div id="worldInfoBoard">
        <h2 id="worldName">Select a World</h2>
        <div id="powerStatus" class="powerOff"></div>
        <button id="playWorldButton">Play</button>
      </div>
    </div>
  </div>

  <!-- Multiplayer Panel -->
  <div class="tabPanel" id="multiplayerPanel">
    <!-- Multiplayer UI will remain here -->
    <!-- Copy your existing multiplayer layout -->
  </div>

  <!-- Your Servers Panel -->
  <div class="tabPanel" id="yourServersPanel">
    <!-- Can be empty for now or future features -->
  </div>

  <script src="singleplayer.js"></script>
</body>
</html>
