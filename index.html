<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voxel Engine</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Top Tabs -->
  <div id="tabs">
    <div class="tab active" data-tab="singleplayer">Singleplayer</div>
    <div class="tab" data-tab="multiplayer">Multiplayer</div>
    <div class="tab" data-tab="yourservers">Your Servers</div>
  </div>

  <!-- Panels -->
  <div class="tabPanel active" id="singleplayerPanel">
    <div id="singleplayerUI">
      <!-- World list -->
      <div id="worldListContainer">
        <ul id="worldList"></ul>
      </div>
      <!-- World info and controls -->
      <div id="worldInfo">
        <h2 id="worldName">Select a world</h2>
        <button id="powerButton" title="Toggle Power"></button>
        <button id="playWorldButton">Play</button>
      </div>
    </div>
  </div>

  <div class="tabPanel" id="multiplayerPanel">
    <p style="padding:20px;">Multiplayer UI coming soon.</p>
  </div>

  <div class="tabPanel" id="yourserversPanel">
    <p style="padding:20px;">Your Servers UI coming soon.</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
