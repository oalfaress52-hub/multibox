<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Voxel Engine</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== TOP TABS ===== -->
  <div id="tabs">
    <div class="tab" data-tab="singleplayer">Singleplayer</div>
    <div class="tab active" data-tab="multiplayer">Multiplayer</div>
    <div class="tab" data-tab="settings">Settings</div>
  </div>

  <!-- ===== SEARCH BAR ===== -->
  <div id="searchBarContainer">
    <input 
      type="text" 
      id="serverSearch" 
      placeholder="Search servers..."
    />
  </div>

  <!-- ===== MAIN UI ===== -->
  <div id="uiContainer">

    <!-- Sidebar -->
    <div id="sidebar">
      <ul id="serverList"></ul>
    </div>

    <!-- Main Panel -->
    <div id="mainPanel">

      <h2 id="serverHeader">
        <span id="serverName">Select a server</span>
        <img id="serverIcon" src="" alt="" />
      </h2>

      <p id="serverType"></p>

      <label for="inviteInput">Invite Code:</label>
      <input type="text" id="inviteInput" maxlength="8">

      <p id="inviteError"></p>

      <label for="username">Username:</label>
      <input type="text" id="username">

      <label for="password">Password:</label>
      <input type="password" id="password">

      <button id="playButton">Play</button>

    </div>
  </div>

  <!-- ===== BABYLON CANVAS ===== -->
  <canvas id="renderCanvas"></canvas>

  <script src="app.js"></script>
  <script type="module" src="../src/main.js"></script>

</body>
</html>
